[package]
name = "agy-auto-approve"
version = "0.4.3"
edition = "2024"
description = "Antigravity auto-approval hook and persistent reviewer daemon"
license = "MIT"
repository = "https://github.com/jjyr/agy-auto-approve"

[[bin]]
name = "agy-auto-approve"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
